<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Cósmico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
<header>
        <h1>Galaxy Explorer </h1>
        <nav>
            <a href="#apod" class="nav-link active">Foto del Día</a>
            <a href="#iss" class="nav-link">Rastreador ISS</a>
            <a href="#asteroids" class="nav-link">Radar de Asteroides</a>
        </nav>
    </header>
    <main>
        <section id="apod" class="page active">
            <h2>Foto Astronómica del Día</h2>
            <div id="apod-container" class="apod-card">
                <div class="loader"></div>
            </div>
        </section>
        <section id="iss" class="page">
            <h2>Posición Actual de la ISS</h2>
            <div id="iss-map-container">
                </div>
            <div id="iss-data-container">
                </div>
        </section>
   <section id="asteroids" class="page">
            <h2>Asteroides Cercanos a la Tierra</h2>
            <div id="asteroids-container">
                </div>
        </section>
        
    </main>
        <script src="utils.js"></script>
    <script src="main.js"></script>
</body>
</html>
