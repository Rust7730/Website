<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Cósmico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
<header>
        <h1>Galaxy Explorer </h1>
        <nav>
            <a href="#apod" class="nav-link active">Foto del Día</a>
            <a href="#mars" class="nav-link">Galería de Marte</a>
            <a href="#search" class="nav-link">Buscador</a>
        </nav>
    </header>
    <main>
        <section id="apod" class="page active">
            <h2>Foto Astronómica del Día</h2>
            <div id="apod-container" class="apod-card">
                <div class="loader"></div>
            </div>
        </section>
        <section id="mars" class="page">
            <h2>Explorando Marte</h2>
            <p>Fotos tomadas por el Rover Curiosity en Marte.</p>
            <div id="mars-gallery" class="gallery">
                <div class="loader"></div>
            </div>

        </section>
        <section id="search" class="page">
            <h2>Buscador de la Biblioteca de la NASA</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Ej: Orion Nebula, Apollo 11...">
                <button id="search-button">Buscar</button>
            </div>
            <div id="search-results" class="gallery">
                </div>
        </section>
        
    </main>
    
</body>
</html>
